name: Update Release

on:
  push:
    paths:
      - '*.zip'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Set repo secret PUSH_TOKEN (PAT with `repo` + `workflow` scopes) to let
      # the zip update .github/workflows. Without it, workflows are preserved.
      HAS_PUSH_TOKEN: ${{ secrets.PUSH_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Extract and clean
        run: |
          ZIP=$(ls *.zip | head -1)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name "$ZIP" -exec rm -rf {} +
          unzip -o "$ZIP"
          SUBDIR=$(unzip -Z1 "$ZIP" | head -1 | cut -d/ -f1)
          if [ -d "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            cp -a "$SUBDIR"/. . && rm -rf "$SUBDIR"
          fi
          rm -f "$ZIP"

      - name: Keep existing workflows (no PAT)
        if: env.HAS_PUSH_TOKEN != 'true'
        run: |
          rm -rf .github
          git checkout HEAD -- .github

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update release from zip"
          git push
          

name: Android NPU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hexagon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build libonedge-engine.so with Hexagon support
        run: |
          docker run --rm \
            -e OUT=/workspace/build-hexagon-onedge \
            -v "$PWD:/workspace" \
            ghcr.io/snapdragon-toolchain/arm64-android@sha256:91714433626f0d94a926538a1e46ec43756c5b8e3262b91b95df1e812940aed1 \
            bash /workspace/scripts/build-hexagon-onedge-engine.sh

      - uses: actions/upload-artifact@v4
        with:
          name: onedge-hexagon-jni
          path: app/src/main/jniLibs/arm64-v8a
          if-no-files-found: error
          retention-days: 1

  apk:
    needs: native-hexagon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK 27.2.12479018
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: onedge-hexagon-jni
          path: app/src/main/jniLibs/arm64-v8a

      - name: Verify native NPU payload
        run: |
          cd app/src/main/jniLibs/arm64-v8a
          for f in libonedge-engine.so libc++_shared.so libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            test -s "$f" || { echo "Missing NPU library: $f"; exit 1; }
          done
          file libonedge-engine.so

      - name: Build NPU-enabled debug APK
        working-directory: app
        run: |
          chmod +x ../gradlew
          ../gradlew --no-daemon assembleDebug -PbmoePrebuiltNative=true

      - name: Verify APK contains the real NPU backend payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonedge-engine.so'
          for f in libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$f" || { echo "Missing $f in APK"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: onedge-npu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
